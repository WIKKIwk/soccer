[package]
name = "football-platform"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
football-contracts = { path = "../contracts" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "registry"] }
uuid = { version = "1", default-features = false, features = ["v7", "std", "fast-rng"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
