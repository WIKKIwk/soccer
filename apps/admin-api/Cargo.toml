[package]
name = "football-admin-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
football-contracts = { path = "../../crates/contracts" }
football-infrastructure = { path = "../../crates/infrastructure" }
football-platform = { path = "../../crates/platform" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
