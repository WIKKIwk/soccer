[package]
name = "footballctl"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
football-application = { path = "../../crates/application" }
football-domain = { path = "../../crates/domain" }
football-infrastructure = { path = "../../crates/infrastructure" }
football-platform = { path = "../../crates/platform" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = { version = "=0.3.47", default-features = false, features = ["parsing", "std"] }
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
